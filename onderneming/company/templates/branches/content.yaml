# Tak-sjabloon: blogs, content en affiliate. Agents heten naar bomen.
name: Content en affiliate
description: Nuttige, eerlijke content (vergelijkingen, gidsen) met affiliate-inkomsten of advertenties als verdienmodel.
monthlyBudgetEur: 30
agents:
  - { template: tak-lead, name: Eik, lead: true }
  - { template: verkenner, name: Beuk }
  - { template: criticus, name: Wilg }
  - { template: schrijver, name: Berk }
routines:
  - title: "Weekstart {{BRANCH_NAME}}"
    assignee: Eik
    cron: "0 9 * * 1"
    priority: high
    description: |
      Loop de lopende experimenten van {{BRANCH_NAME}} na in HQ en plan de schrijftaken van deze week.
  - title: "Ideeënraad {{BRANCH_NAME}}"
    assignee: Eik
    cron: "0 10 * * 3"
    priority: medium
    description: |
      Draai de ideeënraad (skill ideeenraad). Lopen er in deze tak al 2 experimenten, of wachten er 2 voorstellen op Kalle? Sla de raad dan over en
      schrijf in één regel waarom: meer ideeën dan Kalle kan kiezen is weggegooid geld.
      Beuk verkent zoekvragen zonder goed antwoord (zoekdata, fora, "vs"-zoekopdrachten) en affiliate-programma's
      met een eerlijke vergoeding. Daarna maak jij de top 5, dan Wilg (schiet ≥3 af).
